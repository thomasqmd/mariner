url: https://thomasqmd.github.io/mariner/

template:
  bootstrap: 5

# The default "links" component searches CRAN and Bioconductor by package name
# and finds an unrelated Bioconductor package also called mariner. Spelled out
# here instead.
home:
  sidebar:
    structure: [links, license, citation, authors, dev]
    components:
      links:
        title: Links
        text: |
          [Browse source code](https://github.com/thomasqmd/mariner)

          [Report a bug](https://github.com/thomasqmd/mariner/issues)

navbar:
  left:
    - text: "Get Started"
      href: articles/get-started.html
    - text: "Theming & Scales"
      href: articles/theming.html
    # Rendered by data-raw/render-examples.R into pkgdown/assets/, which pkgdown
    # copies into docs/ verbatim -- so the href has no articles/ prefix.
    - text: "Gallery (PDF)"
      href: mariner-gallery.pdf
    - text: "Reference"
      href: reference/index.html
    - text: "Changelog"
      href: news/index.html
  right:
    - icon: fa-github
      href: https://github.com/thomasqmd/mariner
      aria-label: GitHub

reference:
  - title: "Setup and Scaffolding"
    desc: "Create the project folders and check the machine."
    contents:
      - mariner_check_setup
      - mariner_setup_project
      - mariner_dirs
      - mariner_project_root
      - mariner_looks_like_project
      - mariner_install_fonts
  - title: "Template and Generation"
    desc: "Write .qmd sources from a template."
    contents:
      - generate_reports
      - mariner_templates
      - mariner_template_path
  - title: "Rendering and Bundling"
    desc: "Render the documents and bundle them."
    contents:
      - process_file
      - process_files
  - title: "Theming and Palettes"
    desc: "Brand colours, the ggplot2 theme, and chunk options."
    contents:
      - theme_mariner
      - mariner_set_theme
      - mariner_colors
      - mariner_pal
      - mariner_knitr_setup
      - mariner_fig_dims
      - mariner_themes
      - mariner_formats
  - title: "Scales"
    desc: "ggplot2 scales over the brand palettes."
    contents:
      - starts_with("scale_")
